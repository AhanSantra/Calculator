name: Extract Dell Driver EXE

on:
  workflow_dispatch:

jobs:
  extract-driver:
    runs-on: windows-latest
    steps:
      - name: Download Dell Driver EXE
        run: |
          curl -L -o $env:RUNNER_TEMP\driver.exe "https://dl.dell.com/FOLDER03387821M/1/Inspiron_20_Model_3043_A12.exe"

      - name: Run installer silently
        run: |
          $temp = $env:TEMP
          $before = Get-ChildItem $temp -Recurse | Select-Object FullName
          Start-Process -FilePath "$env:RUNNER_TEMP\driver.exe" -ArgumentList "/s" -Wait
          $after = Get-ChildItem $temp -Recurse | Select-Object FullName
          $newFiles = Compare-Object $before $after -Property FullName | Where-Object { $_.SideIndicator -eq "=>" }
          mkdir extracted
          foreach ($f in $newFiles) {
            try {
              Copy-Item $f.FullName extracted -Force
            } catch {}
          }

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: dell-driver-files
          path: extracted
