name: Extract Dell Driver EXE

on:
  workflow_dispatch:

jobs:
  extract-driver:
    runs-on: windows-latest
    steps:
      - name: Download Dell Driver EXE
        run: |
          curl -L -o $env:RUNNER_TEMP\driver.exe "https://dl.dell.com/FOLDER03387821M/1/Inspiron_20_Model_3043_A12.exe"

      - name: Try /s /f extraction
        run: |
          mkdir extracted
          try {
            & "$env:RUNNER_TEMP\driver.exe" /s /f extracted
          } catch {
            Write-Host "Force extract not supported, will scan TEMP"
          }

      - name: Scan TEMP for unpacked files
        run: |
          $temp = $env:TEMP
          $dest = "extracted"
          if (!(Test-Path $dest)) { mkdir $dest }
          # Look for driver files dropped in TEMP
          Get-ChildItem $temp -Recurse -Include *.inf,*.sys,*.cat -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $dest -Force }

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: dell-driver-files
          path: extracted
