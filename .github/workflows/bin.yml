name: Extract Dell Driver EXE

on:
  workflow_dispatch:

jobs:
  extract-driver:
    runs-on: windows-latest
    steps:
      - name: Download Dell Driver EXE
        run: |
          Invoke-WebRequest -Uri "https://dl.dell.com/FOLDER03387821M/1/Inspiron_20_Model_3043_A12.exe" -OutFile "$env:RUNNER_TEMP\driver.exe"
          Get-Item "$env:RUNNER_TEMP\driver.exe" | Select-Object Name, Length

      - name: Run installer silently
        run: |
          dir

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: dell-driver-files
          path: extracted
