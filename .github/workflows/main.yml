name: Download and Upload Artifact

on:
  workflow_dispatch:

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file from MediaFire
        run: |
          wget --content-disposition "https://www.mediafire.com/file/1263zy82q612ub4/NeoProgrammer+V2.2.0.10.zip/file" -O NeoProgrammer.zip

      - name: Verify file
        run: ls -lh NeoProgrammer.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoProgrammer
          path: NeoProgrammer.zip
